<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="%VITE_API_BASE_URL%" />
    <title>Reserva</title>
    <script>
      (function () {
        var path = location.pathname;
        var isPublicCustomer =
          path.indexOf("/book/") === 0 || path.indexOf("/appointment/") === 0;
        if (!isPublicCustomer) {
          var pre = document.createElement("link");
          pre.rel = "preconnect";
          pre.href = "https://fonts.googleapis.com";
          document.head.appendChild(pre);
          var pre2 = document.createElement("link");
          pre2.rel = "preconnect";
          pre2.href = "https://fonts.gstatic.com";
          pre2.crossOrigin = "anonymous";
          document.head.appendChild(pre2);
          var font = document.createElement("link");
          font.rel = "stylesheet";
          font.href =
            "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&display=swap";
          font.media = "print";
          font.onload = function () {
            font.media = "all";
          };
          document.head.appendChild(font);
        }
        var api = "%VITE_API_BASE_URL%".replace(/\/$/, "");
        if (!api || api.indexOf("%VITE_") !== -1) return;
        var m = path.match(/^\/book\/([A-Za-z0-9\-]+)/);
        if (!m) return;
        window.__BOOKING_BOOTSTRAP_SLUG__ = m[1];
        window.__BOOKING_BOOTSTRAP__ = fetch(
          api + "/api/public/booking/" + encodeURIComponent(m[1]) + "/bootstrap"
        ).then(function (r) {
          if (!r.ok) throw new Error("bootstrap " + r.status);
          return r.json();
        });
      })();
    </script>
  </head>
  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
